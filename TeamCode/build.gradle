apply plugin: 'com.android.application'

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

repositories {
    maven {
        url = rootProject.file('libs/acme-local-maven').toURI()
    }
    maven {
        url = 'https://maven.brott.dev/'
    }
}

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    compileSdk 35

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()
        }
    }
}

configurations.all {
    exclude group: 'com.google.code.gson', module: 'gson'
}

dependencies {
    implementation project(':FtcRobotController')
    implementation project(path: ':ControlLib', configuration: 'shadow')
    compileOnly project(':WpiMath')
    testImplementation project(path: ':ControlLib', configuration: 'shadow')
    testImplementation project(':WpiMath')
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation 'com.acmerobotics.roadrunner:ftc:0.1.25'
    implementation 'com.acmerobotics.roadrunner:core'
    implementation 'com.acmerobotics.roadrunner:actions'
    implementation "com.acmerobotics.dashboard:dashboard:0.6.0"
}
