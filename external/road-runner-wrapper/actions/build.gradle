apply plugin: 'java-library'
apply plugin: 'kotlin'

group = 'com.acmerobotics.roadrunner'
version = '1.0.1'

compileKotlin {
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ['-Xjvm-default=all-compatibility']
    }
}

sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17

sourceSets {
    main {
        kotlin {
            srcDirs = ['../../road-runner/road-runner/actions/src/main/kotlin']
        }
    }
}

dependencies {
    api project(':core')
    api "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
    // dashboard:core is substituted from the ftc-dashboard composite build
    api 'com.acmerobotics.dashboard:core:0.4.7'
}
