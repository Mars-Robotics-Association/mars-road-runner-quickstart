pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        // ControlLib / ControlLab apply org.jetbrains.kotlin.jvm without a version.
        // 2.2.20: Gradle 9.1 and kotlinx-coroutines 1.11.0.
        id 'org.jetbrains.kotlin.jvm' version '2.2.20'
        id 'org.jetbrains.kotlin.android' version '2.2.20'
    }
}

include ':FtcRobotController'
include ':TeamCode'
include ':MeepMeepTesting'

// --- MarsCommonFtc modules ---
include ':WpiMath'
project(':WpiMath').projectDir = file('MarsCommonFtc/WpiMath')

include ':ControlLib'
project(':ControlLib').projectDir = file('MarsCommonFtc/ControlLib')

include ':ControlLab'
project(':ControlLab').projectDir = file('MarsCommonFtc/ControlLab')

include ':RuckigJava'
project(':RuckigJava').projectDir = file('MarsCommonFtc/RuckigJava')

// --- Road Runner modules ---
includeBuild('libs/road-runner/road-runner') {
    dependencySubstitution {
        substitute module('com.acmerobotics.roadrunner:core') using project(':core')
        substitute module('com.acmerobotics.roadrunner:actions') using project(':actions')
    }
}
