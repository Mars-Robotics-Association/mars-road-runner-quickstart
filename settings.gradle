include ':FtcRobotController'
include ':TeamCode'

// --- MarsCommonFtc modules ---
include ':WpiMath'
project(':WpiMath').projectDir = file('MarsCommonFtc/WpiMath')

include ':ControlLib'
project(':ControlLib').projectDir = file('MarsCommonFtc/ControlLib')

include ':ControlLab'
project(':ControlLab').projectDir = file('MarsCommonFtc/ControlLab')

include ':RuckigNative'
project(':RuckigNative').projectDir = file('MarsCommonFtc/RuckigNative')

// --- External composite builds ---
includeBuild('external/road-runner-wrapper') {
    dependencySubstitution {
        substitute module('com.acmerobotics.roadrunner:core') using project(':core')
        substitute module('com.acmerobotics.roadrunner:actions') using project(':actions')
        substitute module('com.acmerobotics.roadrunner:ftc') using project(':roadrunner-ftc')
    }
}

includeBuild('external/ftc-dashboard') {
    dependencySubstitution {
        substitute module('com.acmerobotics.dashboard:dashboard') using project(':FtcDashboard')
        substitute module('com.acmerobotics.dashboard:core') using project(':DashboardCore')
    }
}
